<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow">
	<title>GitHub</title>
	<style>
		/* ============================================================
		   Design Tokens — 与 index.html / 404.html 一致
		   ============================================================ */
		:root {
			--bg-base: #0a0d14;
			--accent: #58a6ff;
			--success: #3fb950;
			--font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
				Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
			--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
		}

		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

		html, body { height: 100%; overflow: hidden; }

		body {
			font-family: var(--font-sans);
			background-color: var(--bg-base);
			background-image:
				radial-gradient(ellipse 70% 55% at 18% 12%, rgba(63, 185, 80, 0.10), transparent 60%),
				radial-gradient(ellipse 65% 50% at 82% 18%, rgba(88, 166, 255, 0.10), transparent 55%),
				radial-gradient(ellipse 80% 60% at 50% 100%, rgba(163, 113, 247, 0.08), transparent 60%);
			background-attachment: fixed;
			color: #fff;
			position: relative;
			cursor: crosshair;
			-webkit-font-smoothing: antialiased;
		}

		/* 背景缓慢漂移层（叠加在渐变 mesh 上） */
		.aurora {
			position: fixed;
			inset: -10%;
			background:
				radial-gradient(circle at 30% 40%, rgba(63, 185, 80, 0.06), transparent 40%),
				radial-gradient(circle at 70% 60%, rgba(88, 166, 255, 0.06), transparent 40%);
			filter: blur(40px);
			animation: drift 24s ease-in-out infinite alternate;
			pointer-events: none;
			z-index: 0;
		}

		@keyframes drift {
			0%   { transform: translate(0, 0) scale(1); }
			50%  { transform: translate(3%, -2%) scale(1.05); }
			100% { transform: translate(-2%, 3%) scale(1.02); }
		}

		/* Canvas 星群 */
		#stage {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 1;
		}

		/* ============================================================
		   中心 Octocat 徽章
		   ============================================================ */
		.emblem-wrap {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 0;
			height: 0;
			z-index: 2;
			pointer-events: none;
		}

		.emblem {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 220px;
			height: 220px;
			transform: translate(-50%, -50%);
			opacity: 0.16;
			animation: breathe 6s ease-in-out infinite;
		}

		.emblem svg {
			width: 100%;
			height: 100%;
			fill: #fff;
			filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.35));
		}

		@keyframes breathe {
			0%, 100% { opacity: 0.14; transform: translate(-50%, -50%) scale(1); }
			50%      { opacity: 0.22; transform: translate(-50%, -50%) scale(1.06); }
		}

		/* 光环 */
		.halo {
			position: absolute;
			top: 50%;
			left: 50%;
			border-radius: 50%;
			border: 1px dashed rgba(255, 255, 255, 0.12);
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		.halo--a {
			width: 300px;
			height: 300px;
			animation: spin 40s linear infinite;
		}

		.halo--b {
			width: 400px;
			height: 400px;
			border-color: rgba(88, 166, 255, 0.10);
			border-style: dotted;
			animation: spin 60s linear infinite reverse;
		}

		@keyframes spin {
			from { transform: translate(-50%, -50%) rotate(0deg); }
			to   { transform: translate(-50%, -50%) rotate(360deg); }
		}

		/* ============================================================
		   底部贡献热力图波浪条（致敬 GitHub signature，无数据）
		   ============================================================ */
		.heat-bar {
			position: fixed;
			bottom: 22px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 4px;
			padding: 10px 14px;
			background: rgba(22, 27, 38, 0.45);
			border: 1px solid rgba(255, 255, 255, 0.06);
			border-radius: 10px;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			z-index: 3;
			opacity: 0.55;
		}

		.heat-cell {
			width: 11px;
			height: 11px;
			border-radius: 2px;
			animation: heatPulse 3.4s ease-in-out infinite;
		}

		@keyframes heatPulse {
			0%, 100% { opacity: 0.25; transform: scale(0.85); }
			50%      { opacity: 1;    transform: scale(1); }
		}

		/* ============================================================
		   顶部在线脉冲点
		   ============================================================ */
		.pulse-dot {
			position: fixed;
			top: 22px;
			left: 22px;
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: var(--success);
			box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5);
			animation: pulse 2.2s ease-out infinite;
			z-index: 3;
		}

		@keyframes pulse {
			0%   { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5); }
			70%  { box-shadow: 0 0 0 12px rgba(63, 185, 80, 0); }
			100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
		}

		/* ============================================================
		   响应式 + 动效降级
		   ============================================================ */
		@media (max-width: 640px) {
			.emblem { width: 150px; height: 150px; }
			.halo--a { width: 210px; height: 210px; }
			.halo--b { width: 280px; height: 280px; }
			.heat-bar { display: none; }
		}

		@media (prefers-reduced-motion: reduce) {
			.aurora, .emblem, .halo, .heat-cell, .pulse-dot {
				animation: none !important;
			}
		}
	</style>
</head>
<body>
	<div class="aurora" aria-hidden="true"></div>
	<canvas id="stage" aria-hidden="true"></canvas>

	<div class="emblem-wrap" aria-hidden="true">
		<div class="halo halo--b"></div>
		<div class="halo halo--a"></div>
		<div class="emblem">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 98 96">
				<path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/>
			</svg>
		</div>
	</div>

	<div class="pulse-dot" aria-hidden="true"></div>
	<div class="heat-bar" id="heatBar" aria-hidden="true"></div>

	<script>
	(function () {
		"use strict";

		/* ---------- 底部热力图色带（GitHub 贡献色阶，无数据） ---------- */
		const HEAT_COLORS = ["#0e4429", "#006d32", "#26a641", "#39d353"];
		const heatBar = document.getElementById("heatBar");
		const CELL_COUNT = 36;
		for (let i = 0; i < CELL_COUNT; i++) {
			const cell = document.createElement("span");
			cell.className = "heat-cell";
			cell.style.background = HEAT_COLORS[i % HEAT_COLORS.length];
			cell.style.animationDelay = (i * 0.12) + "s";
			heatBar.appendChild(cell);
		}

		/* ---------- Canvas 星群 ---------- */
		const canvas = document.getElementById("stage");
		const ctx = canvas.getContext("2d");
		const DPR = Math.min(window.devicePixelRatio || 1, 2);

		let W = 0, H = 0, cx = 0, cy = 0;
		const mouse = { x: -9999, y: -9999, active: false };

		// 色板：绿色为主，蓝/紫点缀
		const PALETTE = [
			"#3fb950", "#3fb950", "#3fb950", "#39d353",
			"#58a6ff", "#58a6ff",
			"#a371f7"
		];

		const NODE_COUNT = 92;
		const LINK_DIST = 132;
		const LINK_DIST_SQ = LINK_DIST * LINK_DIST;
		const MOUSE_R = 170;
		const MOUSE_R_SQ = MOUSE_R * MOUSE_R;

		const nodes = [];
		const flow = []; // 沿连线流动的光点

		function rand(min, max) { return Math.random() * (max - min) + min; }

		function Node() {
			this.x = rand(0, W);
			this.y = rand(0, H);
			this.vx = rand(-0.22, 0.22);
			this.vy = rand(-0.22, 0.22);
			this.r = rand(1.1, 2.4);
			this.phase = rand(0, Math.PI * 2);
			this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
		}

		Node.prototype.step = function (t) {
			this.x += this.vx;
			this.y += this.vy;

			// 边界软反弹
			if (this.x < -20) this.x = W + 20;
			else if (this.x > W + 20) this.x = -20;
			if (this.y < -20) this.y = H + 20;
			else if (this.y > H + 20) this.y = -20;

			// 鼠标排斥 + 高亮
			if (mouse.active) {
				const dx = this.x - mouse.x;
				const dy = this.y - mouse.y;
				const dsq = dx * dx + dy * dy;
				if (dsq < MOUSE_R_SQ && dsq > 1) {
					const d = Math.sqrt(dsq);
					const force = (1 - d / MOUSE_R) * 0.6;
					this.x += (dx / d) * force;
					this.y += (dy / d) * force;
				}
			}

			this.pulse = 0.7 + 0.3 * Math.sin(t * 0.0018 + this.phase);
		};

		function resize() {
			W = window.innerWidth;
			H = window.innerHeight;
			cx = W / 2;
			cy = H / 2;
			canvas.width = W * DPR;
			canvas.height = H * DPR;
			canvas.style.width = W + "px";
			canvas.style.height = H + "px";
			ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
		}

		function initNodes() {
			nodes.length = 0;
			for (let i = 0; i < NODE_COUNT; i++) nodes.push(new Node());
		}

		function hexToRgb(hex) {
			const n = parseInt(hex.slice(1), 16);
			return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
		}

		// 预解析颜色
		nodes.rgbCache = {};

		function getRgb(hex) {
			if (!nodes.rgbCache[hex]) nodes.rgbCache[hex] = hexToRgb(hex);
			return nodes.rgbCache[hex];
		}

		function draw(t) {
			ctx.clearRect(0, 0, W, H);

			// 更新节点
			for (let i = 0; i < nodes.length; i++) nodes[i].step(t);

			// 绘制连线 + 流动光点
			flow.length = 0;
			for (let i = 0; i < nodes.length; i++) {
				const a = nodes[i];
				for (let j = i + 1; j < nodes.length; j++) {
					const b = nodes[j];
					const dx = a.x - b.x;
					const dy = a.y - b.y;
					const dsq = dx * dx + dy * dy;
					if (dsq < LINK_DIST_SQ) {
						const d = Math.sqrt(dsq);
						const alpha = (1 - d / LINK_DIST) * 0.42;

						// 鼠标附近增亮
						let boost = 1;
						if (mouse.active) {
							const mx = (a.x + b.x) / 2 - mouse.x;
							const my = (a.y + b.y) / 2 - mouse.y;
							if (mx * mx + my * my < MOUSE_R_SQ) boost = 1.8;
						}

						const ca = getRgb(a.color);
						const cb = getRgb(b.color);
						const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
						grad.addColorStop(0, `rgba(${ca.r},${ca.g},${ca.b},${alpha * boost})`);
						grad.addColorStop(1, `rgba(${cb.r},${cb.g},${cb.b},${alpha * boost})`);
						ctx.strokeStyle = grad;
						ctx.lineWidth = 1;
						ctx.beginPath();
						ctx.moveTo(a.x, a.y);
						ctx.lineTo(b.x, b.y);
						ctx.stroke();

						// 部分连线上生成流动光点
						if (d > 40 && Math.random() < 0.012) {
							flow.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, t: 0, color: a.color });
						}
					}
				}
			}

			// 绘制流动光点（沿连线移动）
			for (let k = flow.length - 1; k >= 0; k--) {
				const f = flow[k];
				f.t += 0.02;
				if (f.t >= 1) { flow.splice(k, 1); continue; }
				const px = f.ax + (f.bx - f.ax) * f.t;
				const py = f.ay + (f.by - f.ay) * f.t;
				const c = getRgb(f.color);
				ctx.beginPath();
				ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.95)`;
				ctx.arc(px, py, 1.6, 0, Math.PI * 2);
				ctx.fill();
				// 拖尾
				ctx.beginPath();
				ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.25)`;
				ctx.arc(px - (f.bx - f.ax) * 0.02, py - (f.by - f.ay) * 0.02, 1, 0, Math.PI * 2);
				ctx.fill();
			}

			// 绘制节点（径向发光）
			for (let i = 0; i < nodes.length; i++) {
				const n = nodes[i];
				const radius = n.r * n.pulse;
				const c = getRgb(n.color);

				// 外层光晕
				const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, radius * 6);
				glow.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${0.55 * n.pulse})`);
				glow.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
				ctx.fillStyle = glow;
				ctx.beginPath();
				ctx.arc(n.x, n.y, radius * 6, 0, Math.PI * 2);
				ctx.fill();

				// 实心核
				ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},0.95)`;
				ctx.beginPath();
				ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
				ctx.fill();
			}
		}

		const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

		function loop(t) {
			draw(t);
			if (!prefersReducedMotion) {
				requestAnimationFrame(loop);
			}
		}

		/* ---------- 事件 ---------- */
		window.addEventListener("resize", function () { resize(); initNodes(); });
		window.addEventListener("mousemove", function (e) {
			mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
		});
		window.addEventListener("mouseleave", function () { mouse.active = false; });
		window.addEventListener("touchmove", function (e) {
			if (e.touches[0]) {
				mouse.x = e.touches[0].clientX;
				mouse.y = e.touches[0].clientY;
				mouse.active = true;
			}
		}, { passive: true });
		window.addEventListener("touchend", function () { mouse.active = false; });

		/* ---------- 启动 ---------- */
		resize();
		initNodes();
		if (prefersReducedMotion) {
			draw(0); // 减少动态效果偏好：仅渲染静态一帧
		} else {
			requestAnimationFrame(loop);
		}
	})();
	</script>
</body>
</html>
